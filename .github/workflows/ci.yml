name: CI

# Unit + integration layer only (tsc + Vitest), same two layers covered by
# `npm test` locally. Playwright e2e (tests/e2e/) is deliberately NOT run
# here: those specs drive a real browser against a running dev server and
# hit real third-party test APIs (Razorpay's hosted Checkout, Meta's
# WhatsApp Graph API) that need real credentials and a seeded dev DB — see
# README's Testing section. They stay local-only (`npm run test:e2e`).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Matches vitest.config.ts's hardcoded TEST_DATABASE_URL
    # (postgresql://clp:clp@localhost:55433/client_lifecycle_platform_test)
    # — the container's internal 5432 is mapped to host port 55433 so no
    # source file needs to change for CI.
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clp
          POSTGRES_PASSWORD: clp
          POSTGRES_DB: client_lifecycle_platform_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck

      # No ANTHROPIC_API_KEY / EMAIL_PROVIDER_API_KEY / WHATSAPP_PROVIDER_API_KEY
      # secrets needed — every integration-module call site already falls
      # back gracefully (dev-mode console.log) when a provider key is unset
      # or a provider call fails, same behavior this suite already relies on
      # locally (this repo's own .env ships an empty ANTHROPIC_API_KEY).
      - run: npm test
